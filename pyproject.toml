[project]
name = "openalex-cli"
version = "0.1.0"
description = "OpenAlex CLI: semantic search of papers and impact-based cluster analysis"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Diego Romero" }]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "truststore>=0.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "openai>=1.60",
    "scikit-learn>=1.6",
    "numpy>=2.2",
    # numba<0.60 ships no wheels for Python 3.14; without this floor the resolver
    # backtracks to numba 0.53 / llvmlite 0.36 (which fail to build on 3.14) while
    # trying to keep numpy at 2.5. The floor forces the working numba>=0.60 line,
    # which in turn caps numpy at <2.5. umap-learn pulls numba in transitively.
    "numba>=0.60",
    "umap-learn>=0.5.6",
]

[project.scripts]
oa = "openalex_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openalex_cli"]
